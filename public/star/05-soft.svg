<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="star-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE87C"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFB347"/>
    </linearGradient>
  </defs>
  <g transform="translate(180,200)">
    <!-- Heart -->
    <path d="M100,-60 C100,-80 80,-80 70,-60 C60,-80 40,-80 40,-60 C40,-30 70,10 70,10 C70,10 100,-30 100,-60" fill="#FFB6C1" transform="translate(20,-30) scale(0.8)"/>
    <!-- Star body -->
    <path d="M0,-120 Q40,-100 70,-70 Q100,-40 100,0 Q100,40 70,70 Q40,100 0,100 Q-40,100 -70,70 Q-100,40 -100,0 Q-100,-40 -70,-70 Q-40,-100 0,-120" 
          fill="url(#star-body)"/>
    <!-- Closed peaceful eyes -->
    <path d="M-50,-10 Q-35,5 -20,-10" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
    <path d="M20,-10 Q35,5 50,-10" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
    <!-- Small smile -->
    <path d="M-15,30 Q0,40 15,30" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="200" y="380" text-anchor="middle" fill="#666" font-family="system-ui" font-size="14">PLACEHOLDER - Add 05-soft.png</text>
</svg>
