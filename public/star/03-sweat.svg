<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="star-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE87C"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFB347"/>
    </linearGradient>
    <linearGradient id="sweat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0F0FF"/>
      <stop offset="100%" style="stop-color:#88CCFF"/>
    </linearGradient>
  </defs>
  <g transform="translate(200,200)">
    <!-- Sweat drop -->
    <path d="M-80,-100 Q-90,-80 -80,-70 Q-70,-80 -80,-100" fill="url(#sweat)" transform="scale(1.5)"/>
    <!-- Star body -->
    <path d="M0,-120 Q40,-100 70,-70 Q100,-40 100,0 Q100,40 70,70 Q40,100 0,100 Q-40,100 -70,70 Q-100,40 -100,0 Q-100,-40 -70,-70 Q-40,-100 0,-120" 
          fill="url(#star-body)"/>
    <!-- Half-lidded tired eyes -->
    <ellipse cx="-35" cy="-5" rx="20" ry="12" fill="white"/>
    <ellipse cx="35" cy="-5" rx="20" ry="12" fill="white"/>
    <ellipse cx="-35" cy="-3" rx="10" ry="8" fill="#1a1a1a"/>
    <ellipse cx="35" cy="-3" rx="10" ry="8" fill="#1a1a1a"/>
    <!-- Eyelids -->
    <path d="M-55,-10 Q-35,-20 -15,-10" fill="none" stroke="url(#star-body)" stroke-width="8"/>
    <path d="M15,-10 Q35,-20 55,-10" fill="none" stroke="url(#star-body)" stroke-width="8"/>
  </g>
  <text x="200" y="380" text-anchor="middle" fill="#666" font-family="system-ui" font-size="14">PLACEHOLDER - Add 03-sweat.png</text>
</svg>
